<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer-Alarm App</title>
  <link rel="stylesheet" href="./src/css/reset.css">
  <link rel="stylesheet" href="./src/css/base.css">
  <link rel="stylesheet" href="./src/css/timer.css">
  <link rel="stylesheet" href="./src/css/alarm.css">
  <link rel="stylesheet" href="./src/css/responsive.css">
  <script src="./src/TSfile/main.ts" type="module"></script>
</head>

<body>

  <header class="header">
    <h1>Timer-Alarm App</h1>

    <nav class="mode-nav">
      <button id="timerModeButton" class="mode-button active" type="button">
        Timer-Mode
      </button>

      <button id="alarmModeButton" class="mode-button" type="button">
        Alarm-Mode
      </button>
    </nav>
  </header>


  <main>

    <!-- タイマーモード -->

    <section id="timerMode" class="mode-screen">

      <!-- 設定したタイマー表示欄（スタート後に表示） -->
      <div class="timer-set-display" id="timerSetDisplay"></div>

      <div class="timer-display" id="timerDisplay">
        00:00:00
      </div>

      <button id="historyButton" class="history-button" type="button">
        History
        <span class="history-icon">↶</span>
      </button>

      <div class="timer-actions">
        <button id="timerActionButton" class="start-button invisible" type="button">Start</button>
      </div>

      <div class="timer-cancel">
        <button id="cancelButton" class="start-button cancel-button invisible" type="button">Cancel</button>
      </div>

      <div class="timer-setting" id="timerSetting">

        <div class="slider-row">

          <label for="hourSlider">時：</label>
          <input class="slider-value" id="hourValue" type="text" inputmode="decimal" maxlength="5" value="00"
            aria-label="時間">
          <input id="hourSlider" type="range" min="0" max="23" value="0">
        </div>

        <div class="slider-row">

          <label for="minuteSlider">分：</label>
          <input class="slider-value" id="minuteValue" type="text" inputmode="decimal" maxlength="5" value="00"
            aria-label="分">
          <input id="minuteSlider" type="range" min="0" max="59" value="0">
        </div>

        <div class="slider-row">

          <label for="secondSlider">秒：</label>
          <input class="slider-value" id="secondValue" type="text" inputmode="decimal" maxlength="5" value="00"
            aria-label="秒">
          <input id="secondSlider" type="range" min="0" max="59" value="0">
        </div>

      </div>

    </section>


    <!-- アラームモード -->

    <section id="alarmMode" class="mode-screen hidden">

      <div class="timer-display alarm-display">
        00:00
      </div>

      <button class="alarm-setting-button" type="button">
        Alarm Setting
      </button>


      <div class="alarm-list">

        <h2>Setting List</h2>

        <div class="alarm-item enabled">

          <label class="toggle">
            <input type="checkbox" checked>
            <span class="toggle-slider"></span>
          </label>

          <span class="alarm-time">07:30</span>

          <button class="delete-button" type="button">
            🗑
          </button>

        </div>


        <div class="alarm-item">

          <label class="toggle">
            <input type="checkbox">
            <span class="toggle-slider"></span>
          </label>

          <span class="alarm-time">09:00</span>

          <button class="delete-button" type="button">
            🗑
          </button>

        </div>


        <div class="alarm-item">

          <label class="toggle">
            <input type="checkbox">
            <span class="toggle-slider"></span>
          </label>

          <span class="alarm-time">12:00</span>

          <button class="delete-button" type="button">
            🗑
          </button>

        </div>


        <div class="alarm-item enabled">
          <label class="toggle">
            <input type="checkbox" checked>
            <span class="toggle-slider"></span>
          </label>

          <span class="alarm-time">15:00</span>

          <button class="delete-button" type="button">
            🗑
          </button>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
